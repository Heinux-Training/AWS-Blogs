# Demo app. Reads DB creds from /vault/secrets/db-creds.txt.
# The app.py source lives in ../app/app.py and is injected via a ConfigMap
# that the README creates with `kubectl create configmap app-code --from-file`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # Turn on injection for this pod
        vault.hashicorp.com/agent-inject: "true"
        # Which Vault K8s auth role to log in as
        vault.hashicorp.com/role: "app-role"
        # Fetch this Vault path...
        vault.hashicorp.com/agent-inject-secret-db-creds.txt: "database/creds/app-role"
        # ...and render it into this file inside the pod.
        vault.hashicorp.com/agent-inject-template-db-creds.txt: |
          {{- with secret "database/creds/app-role" -}}
          DB_USER={{ .Data.username }}
          DB_PASS={{ .Data.password }}
          DB_HOST=postgres.app.svc.cluster.local
          DB_PORT=5432
          DB_NAME=appdb
          {{- end }}
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install --quiet -r /code/requirements.txt && \
              python /code/app.py
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /code
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: app-code
          configMap:
            name: app-code
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: app
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080
