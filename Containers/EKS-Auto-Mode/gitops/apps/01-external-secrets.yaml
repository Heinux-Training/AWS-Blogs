---
# Wave 0: External Secrets Operator. Everything that needs a credential depends on this
# controller running, so it goes in before the repo creds and before any workload.
#
# Project is `default`, not `platform`: a controller install creates CRDs, ClusterRoles and
# webhook configurations, and whitelisting all of that in the platform project would defeat
# the point of having a restricted project for workloads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Verify before applying: helm repo add external-secrets \
    #   https://charts.external-secrets.io && helm search repo external-secrets
    targetRevision: 0.14.3
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        # Pod Identity supplies the credentials, so NO eks.amazonaws.com/role-arn
        # annotation here. The name must match serviceAccountName in
        # eksctl/pod-identity.yaml.
        serviceAccount:
          create: true
          name: external-secrets
        replicaCount: 1
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://1D35F97CD4C78AD94D2D18CC73208679.gr7.ap-southeast-1.eks.amazonaws.com
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs exceed the 262144-byte annotation limit that client-side apply uses.
      # Without ServerSideApply the first sync fails on "metadata.annotations: Too long".
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
