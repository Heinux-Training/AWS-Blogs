---
# The built-in `general-purpose` NodePool explicitly excludes accelerated instance families,
# so GPU pods stay Pending on a stock Auto Mode cluster until you add a pool like this one.
#
# Auto Mode nodes for g/p families boot the NVIDIA-flavoured AL2023 AMI and already run the
# device plugin, so `nvidia.com/gpu` is advertised without installing anything.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  # Higher weight than the default pools so GPU pods land here rather than triggering an
  # unnecessary evaluation of general-purpose.
  weight: 10
  template:
    metadata:
      labels:
        node-type: gpu
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: gpu

      # Taint so *only* pods that explicitly tolerate GPU nodes get scheduled here. Without
      # it every unschedulable pod in the cluster becomes a candidate for a $1/hr node.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      requirements:
        - key: eks.amazonaws.com/instance-family
          operator: In
          # g5g = Graviton2 + NVIDIA T4G, the arm64 GPU family. Auto Mode boots the
          # amazon-linux-2023/arm64/nvidia AMI for these, so the driver and device plugin
          # are already present — nothing to install.
          values: ["g5g"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: topology.kubernetes.io/zone
          operator: In
          # g5g is NOT offered in ap-southeast-1c, but the cluster has private subnets in all
          # three AZs. Without this, Karpenter can pick 1c and every launch there fails with
          # Unsupported/InsufficientInstanceCapacity. Re-check before copying to another
          # region: aws ec2 describe-instance-type-offerings --location-type availability-zone
          #   --filters Name=instance-type,Values=g5g.xlarge
          values: ["ap-southeast-1a", "ap-southeast-1b"]
        - key: karpenter.sh/capacity-type
          operator: In
          # Spot first — a smoke test does not care about interruptions. Drop "spot" for
          # anything long-running.
          values: ["on-demand"]

      # GPU nodes are the most expensive thing in the cluster: recycle them aggressively
      # once idle, and cap lifetime so they pick up AMI patches.
      terminationGracePeriod: 1h
      expireAfter: 168h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m

  limits:
    # Hard ceiling on the blast radius of a runaway workload.
    cpu: "100"
    memory: 500Gi
    nvidia.com/gpu: "10"
