---
# The built-in `general-purpose` NodePool explicitly excludes accelerated instance families,
# so GPU pods stay Pending on a stock Auto Mode cluster until you add a pool like this one.
#
# Auto Mode nodes for g/p families boot the NVIDIA-flavoured AL2023 AMI and already run the
# device plugin, so `nvidia.com/gpu` is advertised without installing anything.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  # Higher weight than the default pools so GPU pods land here rather than triggering an
  # unnecessary evaluation of general-purpose.
  weight: 10
  template:
    metadata:
      labels:
        node-type: gpu
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: gpu

      # Taint so *only* pods that explicitly tolerate GPU nodes get scheduled here. Without
      # it every unschedulable pod in the cluster becomes a candidate for a $1/hr node.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      requirements:
        # Instead of pinning a family, describe the shape we want: any instance that carries
        # an NVIDIA GPU. Auto Mode boots the matching amazon-linux-2023 nvidia AMI variant
        # (arm64 or amd64), so the driver and device plugin are already present either way.
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: Gt
          values: ["0"]
        - key: karpenter.k8s.aws/instance-gpu-manufacturer
          operator: In
          # Keeps Neuron/Gaudi-style accelerators out: those advertise their own extended
          # resource, not nvidia.com/gpu, so the taint and limits below wouldn't apply.
          values: ["nvidia"]
        - key: kubernetes.io/arch
          operator: In
          # Both arches. arm64 is g5g only (Graviton2 + T4G); amd64 opens up g4dn/g5/g6/g6e
          # and the p-family. Karpenter bin-packs for cost, so cheap arm64 g5g usually wins
          # for small requests — which means a pod whose image is amd64-only MUST pin
          # `kubernetes.io/arch: amd64` itself or it will land on arm64 and die with
          # `exec format error`. A mixed-arch pool pushes that decision onto the workload.
          values: ["arm64", "amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: topology.kubernetes.io/zone
          operator: In
          # arm64 GPU capacity (g5g) is NOT offered in ap-southeast-1c, but the cluster has
          # private subnets in all three AZs. Without this, Karpenter can pick 1c and every
          # launch there fails with Unsupported/InsufficientInstanceCapacity. Re-check before
          # copying to another region, or when a new arm64 GPU family lands with a different
          # AZ footprint: aws ec2 describe-instance-type-offerings
          #   --location-type availability-zone --filters Name=instance-type,Values=g5g.*
          values: ["ap-southeast-1a", "ap-southeast-1b"]
        - key: karpenter.sh/capacity-type
          operator: In
          # Spot first — a smoke test does not care about interruptions. Drop "spot" for
          # anything long-running.
          values: ["on-demand"]

      # GPU nodes are the most expensive thing in the cluster: recycle them aggressively
      # once idle, and cap lifetime so they pick up AMI patches.
      terminationGracePeriod: 1h
      expireAfter: 168h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m

  limits:
    # Hard ceiling on the blast radius of a runaway workload.
    cpu: "100"
    memory: 500Gi
    nvidia.com/gpu: "10"
