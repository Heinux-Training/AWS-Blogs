---
# Auto Mode's built-in `default` NodeClass works fine, but it is owned by AWS and cannot be
# edited. Declaring your own gives you control over subnet/SG selection and node tagging,
# which is what you want for a capacity pool that will run expensive GPU instances.
#
# The `eks.amazonaws.com` API group (not `karpenter.k8s.aws`) is the Auto Mode flavour.
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: gpu
spec:
  # Auto Mode creates this role/instance profile as part of cluster creation. Rename only
  # if you customised the node role in eksctl.
  role: eksctl-eks-auto-argocd-cluster-AutoModeNodeRole-64S69BXCDDmL
  subnetSelectorTerms:
    # Private subnets carry this tag from eksctl. GPU nodes should never be public.
    - tags:
        kubernetes.io/role/internal-elb: "1"
        eksctl.cluster.k8s.io/v1alpha1/cluster-name: eks-auto-argocd
  securityGroupSelectorTerms:
    - tags:
       eksctl.cluster.k8s.io/v1alpha1/cluster-name: eks-auto-argocd
  # NVMe instance stores on g5/g6 are ephemeral; the root EBS volume still needs headroom
  # for the CUDA image layers, which are multi-GB.
  ephemeralStorage:
    size: 100Gi
    iops: 3000
    throughput: 125
  # NO custom `tags:` here — deliberately.
  #
  # AmazonEKSComputePolicy gates ec2:CreateLaunchTemplate / CreateFleet / RunInstances on
  #   "ForAllValues:StringLike": { "aws:TagKeys": [
  #       "eks:eks-cluster-name", "eks:kubernetes-node-class-name",
  #       "eks:kubernetes-node-pool-name", "kubernetes.io/cluster/*" ] }
  # ForAllValues means that list is an ALLOW-LIST of tag keys: one extra key on the request
  # (project / component / managed-by) fails the condition and the entire call is denied:
  #   ValidationSucceeded=False  CreateLaunchTemplateAuthCheckFailed
  #     Controller isn't authorized to call ec2:CreateLaunchTemplate
  # Auto Mode still applies the four eks:* tags itself, so nodes remain identifiable.
  #
  # To tag nodes for cost allocation, don't add them here — either attach a customer managed
  # policy to the CLUSTER role (arn above) that allows your keys, or tag via the
  # `general-purpose`/`system` pools' AWS-managed defaults.
