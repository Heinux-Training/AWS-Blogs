---
# ClusterSecretStore pointing at AWS Secrets Manager. Cluster-scoped so any namespace can
# reference it; use a namespaced SecretStore instead if you want to fence tenants off.
#
# No accessKey/secretKey block: `jwt`/`serviceAccountRef` are for IRSA. With Pod Identity the
# SDK inside the ESO pod picks up credentials from the container agent automatically, so the
# auth stanza is omitted entirely.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
