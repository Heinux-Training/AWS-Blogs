---
# THE SSH AUTH PIECE.
#
# ESO reads the deploy key from Secrets Manager and writes a Secret that Argo CD recognises
# as repository credentials. Nothing secret is committed — this file only names the source.
#
# Argo CD discovers credentials by LABEL, not by name:
#   argocd.argoproj.io/secret-type: repo-creds  → creds for every repo under `url` (prefix)
#   argocd.argoproj.io/secret-type: repository  → creds for one exact repo
# `repo-creds` is used here so one key covers every repo in the org.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: git-ssh-creds
  namespace: argocd
spec:
  # How often to re-read Secrets Manager. Rotating the key in AWS propagates within this
  # window with no redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: git-ssh-creds
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          # Without this label Argo CD ignores the Secret completely — the single most
          # common reason SSH auth "does nothing".
          argocd.argoproj.io/secret-type: repo-creds
      data:
        # Prefix match: any repoURL starting with this string uses this key. Must be the SSH
        # form and must match how your Applications spell repoURL.
        url: git@github.com:Heinux-Training
        sshPrivateKey: "{{ .sshPrivateKey }}"

  data:
    - secretKey: sshPrivateKey
      remoteRef:
        # Create this in AWS first — see gitops/README.md § SSH repo auth:
        #   aws secretsmanager create-secret --name argocd/github-deploy-key ...
        key: argocd/github-deploy-key
        # The JSON property inside the secret holding the PEM. A raw (non-JSON) secret value
        # works too — drop this line if you stored the key as plaintext.
        property: sshPrivateKey
